name: CodeQL SAST

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run a full scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # required to upload SARIF results to Code Scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Initialize CodeQL for JavaScript/TypeScript analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      # Auto-build is sufficient for JavaScript (no compilation needed)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # Run the CodeQL analysis and upload results to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
