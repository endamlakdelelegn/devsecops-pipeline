name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1 – Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 – Set up Node.js 20 (LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3 – Install dependencies with npm ci (not npm install)
      # npm ci installs exactly what is in package-lock.json, ensuring
      # reproducible builds. npm install may update the lockfile silently.
      - name: Install dependencies
        run: npm ci

      # Step 4 – Run the tests
      - name: Run tests
        run: npm test

      # Step 5 – Run the linter
      - name: Run linter
        run: npm run lint

      # Step 6 – Verify the application starts (no separate build step for
      # a plain Node.js API; we confirm the entry point loads without errors)
      - name: Verify application loads
        run: npm run verify:app

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fail the pipeline if any HIGH or CRITICAL vulnerabilities are found
      - name: Run npm audit
        run: npm run audit:ci
